# Konfigurasi plat pembaca JUALAN (Rencana 24 Bagian B), ditulis sendiri, bukan berkas rilis fast-plate-ocr.
# Plat Indonesia paling panjang 9 huruf (2 huruf wilayah + 4 angka + 3 huruf seri), jadi 10 slot seperti fpo-indo-1; huruf 0-9 dan
# A-Z dengan "_" sebagai bantalan; masukan 64x128 RGB. Tanpa plate_regions: model tanpa kepala wilayah.
max_plate_slots: 10
alphabet: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_'
pad_char: '_'
img_height: 64
img_width: 128
keep_aspect_ratio: false
interpolation: linear
image_color_mode: rgb
